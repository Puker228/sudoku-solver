name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        build_type: [Release, Debug]
        c_compiler: [clang, cl]
        include:
          - os: windows-2025
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-2025
            c_compiler: clang
          - os: ubuntu-24.04
            c_compiler: cl
          - os: macos-26
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ steps.strings.outputs.build-output-dir }}

  build-ios:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake for iOS
        run: >
          cmake -S ${{ github.workspace }} -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build iOS
        run: cmake --build build/ios --config Release

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-ios-arm64-Release
          path: build/ios
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake for Android
        run: >
          cmake -S ${{ github.workspace }} -B build/android/${{ matrix.abi }} -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-21
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Android
        run: cmake --build build/android/${{ matrix.abi }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-android-${{ matrix.abi }}-Release
          path: build/android/${{ matrix.abi }}
          if-no-files-found: error
